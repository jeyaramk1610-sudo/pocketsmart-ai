
{% extends "base.html" %}
{% block content %}
<section class="auth-wrap">
  <form class="form-card" id="loginForm">
    <p class="eyebrow">Welcome back</p>
    <h1>Login</h1>
    <label>Email<input id="email" type="email" required></label>
    <label>Password<input id="password" type="password" required></label>
    <button class="button primary full" type="submit">Login</button>
    <p id="message" class="form-message"></p>
    <p class="small">New here? <a href="{{ url_for('register_page') }}">Create an account</a></p>
  </form>
</section>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = document.getElementById("message");
  const r = await fetch("/api/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      email: document.getElementById("email").value,
      password: document.getElementById("password").value
    })
  });
  const data = await r.json();
  if (data.ok) location.href = "/dashboard";
  else message.textContent = data.message;
});
</script>
{% endblock %}
