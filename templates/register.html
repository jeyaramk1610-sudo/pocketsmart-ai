
{% extends "base.html" %}
{% block content %}
<section class="auth-wrap">
  <form class="form-card" id="registerForm">
    <p class="eyebrow">Create account</p>
    <h1>Register</h1>
    <label>Name<input id="name" required></label>
    <label>Email<input id="email" type="email" required></label>
    <label>Password<input id="password" type="password" minlength="6" required></label>
    <button class="button primary full" type="submit">Create Account</button>
    <p id="message" class="form-message"></p>
    <p class="small">Already registered? <a href="{{ url_for('login_page') }}">Login</a></p>
  </form>
</section>
<script>
document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = document.getElementById("message");
  const r = await fetch("/api/register", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      name: document.getElementById("name").value,
      email: document.getElementById("email").value,
      password: document.getElementById("password").value
    })
  });
  const data = await r.json();
  if (data.ok) location.href = "/dashboard";
  else message.textContent = data.message;
});
</script>
{% endblock %}
